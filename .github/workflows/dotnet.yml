name: .NET

on:
  push:
    branches: [main]
    paths:
      - "dao/**"
      - "tools/**"
      - "global.json"
      - ".github/workflows/dotnet.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - "dao/**"
      - "tools/**"
      - "global.json"
      - ".github/workflows/dotnet.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'dao/**/*.csproj', 'tools/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tools/TerrainValidation/TerrainValidation.csproj

      - name: Check formatting
        run: dotnet format tools/TerrainValidation/TerrainValidation.csproj --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build tools/TerrainValidation/TerrainValidation.csproj --configuration ${{ env.CONFIGURATION }} --no-restore -m:1 -p:UseSharedCompilation=false -warnaserror

      - name: Verify XML documentation file was generated
        run: test -f dao/.godot/mono/temp/bin/${{ env.CONFIGURATION }}/dao.xml
        shell: bash

      - name: Validate terrain generation
        run: dotnet run --project tools/TerrainValidation/TerrainValidation.csproj --configuration ${{ env.CONFIGURATION }} --no-build -- --seed-count 3
