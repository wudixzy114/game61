name: GDExtension

on:
  push:
    branches: [main]
    paths:
      - "gdextension/**"
      - "dao/bin/dao.gdextension"
      - ".gitmodules"
      - ".github/workflows/gdextension.yml"
  pull_request:
    branches: [main]
    paths:
      - "gdextension/**"
      - "dao/bin/dao.gdextension"
      - ".gitmodules"
      - ".github/workflows/gdextension.yml"
  workflow_dispatch:
    inputs:
      validation_tier:
        description: Native validation tier to run manually
        required: true
        default: native
        type: choice
        options:
          - native
          - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache SCons outputs
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-linux-x86_64-${{ hashFiles('gdextension/SConstruct', 'gdextension/src/**', 'gdextension/godot-cpp/SConstruct', 'gdextension/godot-cpp/tools/**', 'gdextension/godot-cpp/include/**', 'gdextension/godot-cpp/src/**', 'gdextension/godot-cpp/gdextension/**', '.gitmodules') }}
          restore-keys: |
            scons-${{ runner.os }}-linux-x86_64-

      - name: Install SCons
        run: python -m pip install "scons>=4.8,<5"

      - name: Restore terrain validation
        run: dotnet restore tools/TerrainValidation/TerrainValidation.csproj

      - name: Build debug extension
        run: scons --directory=gdextension target=template_debug platform=linux arch=x86_64 api_version=4.6 -j2

      - name: Build release extension
        if: github.event_name != 'pull_request'
        run: scons --directory=gdextension target=template_release platform=linux arch=x86_64 api_version=4.6 -j2

      - name: Verify debug output
        run: |
          ls -la dao/bin
          test -f dao/bin/dao.linux.template_debug.x86_64.so

      - name: Verify release output
        if: github.event_name != 'pull_request'
        run: |
          ls -la dao/bin
          test -f dao/bin/dao.linux.template_release.x86_64.so

      - name: Build terrain validation
        run: dotnet build tools/TerrainValidation/TerrainValidation.csproj --configuration Release --no-restore -m:1 -p:UseSharedCompilation=false -warnaserror

      - name: Validate native sampler parity
        if: github.event_name != 'workflow_dispatch' || inputs.validation_tier == 'native'
        run: >
          dotnet run --project tools/TerrainValidation/TerrainValidation.csproj
          --configuration Release
          --no-build
          --
          --seed 1337
          --skip-corridor-smoke
          --skip-route-scatter-smoke
          --skip-poi-tile-smoke
          --skip-gameplay-scatter-smoke
          --skip-biome-scatter-smoke
          --skip-scenic-landmark-smoke
          --skip-artifact-smoke
          --native-smoke

      - name: Benchmark release native terrain tiles
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.validation_tier == 'native')
        run: >
          dotnet run --project tools/TerrainValidation/TerrainValidation.csproj
          --configuration Release
          --no-build
          --
          --seed 1337
          --skip-corridor-smoke
          --skip-route-scatter-smoke
          --skip-poi-tile-smoke
          --skip-gameplay-scatter-smoke
          --skip-biome-scatter-smoke
          --skip-scenic-landmark-smoke
          --skip-artifact-smoke
          --native-smoke
          --benchmark-tiles
          --benchmark-tile-count 24

      - name: Validate release terrain generation
        if: github.event_name == 'workflow_dispatch' && inputs.validation_tier == 'release'
        run: dotnet run --project tools/TerrainValidation/TerrainValidation.csproj --configuration Release --no-build -- --validation-tier release
