name: GDExtension

on:
  push:
    branches: [main]
    paths:
      - "gdextension/**"
      - "dao/bin/dao.gdextension"
      - ".gitmodules"
      - ".github/workflows/gdextension.yml"
  pull_request:
    branches: [main]
    paths:
      - "gdextension/**"
      - "dao/bin/dao.gdextension"
      - ".gitmodules"
      - ".github/workflows/gdextension.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache SCons outputs
        uses: actions/cache@v5
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-linux-x86_64-${{ hashFiles('gdextension/SConstruct', 'gdextension/src/**', 'gdextension/godot-cpp/SConstruct', 'gdextension/godot-cpp/tools/**', 'gdextension/godot-cpp/include/**', 'gdextension/godot-cpp/src/**', 'gdextension/godot-cpp/gdextension/**', '.gitmodules') }}
          restore-keys: |
            scons-${{ runner.os }}-linux-x86_64-

      - name: Install SCons
        run: python -m pip install "scons>=4.8,<5"

      - name: Build debug extension
        run: scons --directory=gdextension target=template_debug platform=linux arch=x86_64 api_version=4.6 -j2

      - name: Build release extension
        if: github.event_name != 'pull_request'
        run: scons --directory=gdextension target=template_release platform=linux arch=x86_64 api_version=4.6 -j2

      - name: Verify debug output
        run: |
          ls -la dao/bin
          test -f dao/bin/dao.linux.template_debug.x86_64.so

      - name: Verify release output
        if: github.event_name != 'pull_request'
        run: |
          ls -la dao/bin
          test -f dao/bin/dao.linux.template_release.x86_64.so
